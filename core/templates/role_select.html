<!DOCTYPE html>
<html>
<head>
    <title>NotifyHub</title>
    <style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    width: 90%;
    max-width: 900px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

h2, h3 {
    color: #4a47a3;
}

button {
    background: #4a47a3;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #372f8a;
}

a {
    text-decoration: none;
    color: #4a47a3;
    font-weight: bold;
}

a:hover {
    text-decoration: underline;
}

.card {
    background: #f5f7ff;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
}
</style>

</head>
<body>
<div class="container" style="text-align:center">

<h2>Welcome to NotifyHub</h2>
<p>Student Notification System</p>

<br>

<a href="{% url 'student_login' %}">
    <button>🎓 Student Login</button>
</a>

<br><br>

<a href="{% url 'teacher_login' %}">
    <button>👨‍🏫 Teacher Login</button>
</a>

</div>
</body>
</html>
